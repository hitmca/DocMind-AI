<!DOCTYPE html>
<html>

<head>

<title>DocMind Knowledge Graph</title>

<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

<style>

#network{
width:100%;
height:600px;
border:1px solid lightgray;
}

</style>

</head>

<body>

<h2>DocMind AI Knowledge Graph</h2>

<div id="network"></div>

<script>

async function loadGraph(){

let response = await fetch("/graph")

let data = await response.json()

let nodes = new vis.DataSet(data.nodes)
let edges = new vis.DataSet(data.edges)

let container = document.getElementById("network")

let graph = {
nodes:nodes,
edges:edges
}

let options = {
nodes:{shape:"dot",size:20},
physics:{enabled:true}
}

new vis.Network(container,graph,options)

}

loadGraph()

</script>

</body>

</html>
